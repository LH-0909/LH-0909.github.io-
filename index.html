<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张雪峰 · 升学顾问</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login Overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="login-icon">峰</div>
    <h2>张雪峰 · 升学顾问</h2>
    <p class="sub">选择比努力更重要</p>
    <input type="text" id="loginUser" placeholder="用户名" autocomplete="off">
    <input type="password" id="loginPass" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">登 录</button>
    <p class="login-err" id="loginErr"></p>
    <p class="login-hint" id="githubStatus" style="font-size:11px;color:var(--text3);margin-top:8px;"></p>
    <p style="text-align:center;margin-top:10px;"><a href="javascript:openSettings()" style="color:var(--blue);font-size:12px;cursor:pointer;">⚙ 服务器设置</a></p>
  </div>
</div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="side-header">
    <div class="top-row">
      <div class="side-avatar">峰</div>
      <div>
        <div class="side-title">张雪峰 · 顾问</div>
        <div class="side-sub">普通家庭的升学指南</div>
      </div>
    </div>
    <div class="user-badge" id="userBadge"></div>
  </div>
  <div class="side-actions">
    <button class="btn btn-primary" onclick="newSession()">＋ 新对话</button>
    <button class="btn btn-outline" onclick="switchToAnalytics()">📊 分析</button>
  </div>
  <div id="adminUserList" style="display:none;padding:0 14px 8px;">
    <label style="font-size:11px;color:var(--text3);">👥 选择查看用户：</label>
    <select id="viewUserSelect" onchange="switchViewUser(this.value)" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;margin-top:4px;">
    </select>
  </div>
  <div class="session-list" id="sessionList">
    <div class="no-sessions">还没有对话记录<br>点「新对话」开始吧</div>
  </div>
  <div class="side-footer">
    <span class="sr-indicator" id="kbIndicator" style="display:none;background:#fef0e6;color:#d4752b;">KB未配置</span>
    <span class="sr-indicator" id="syncIndicator" style="display:none;background:#e8f0fe;color:var(--blue);">已同步</span>
    <button class="btn btn-sm btn-outline" onclick="syncNow(true)" title="同步会话">🔄</button>
    <button class="btn btn-sm btn-outline" onclick="openSettings()">⚙</button>
  </div>
</aside>

<!-- Main -->
<div class="main">
  <div class="header">
    <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
    <div class="cur-session-name" id="curSessionName">
      <input value="新对话" onchange="renameSession(this.value)" placeholder="给这次对话起个名...">
    </div>
    <span class="msg-count" id="msgCount"></span>
    <div class="admin-bar" id="adminBar"></div>
    <button class="btn btn-sm btn-outline" onclick="switchToAnalytics()">📊</button>
  </div>

  <div class="chat-wrap" id="chatWrap">
    <div class="chat-inner" id="chatInner">
      <div class="welcome" id="welcomeMsg">
        <div class="welcome-icon">峰</div>
        <h2>我是张雪峰</h2>
        <p class="tagline">选择比努力更重要，但「有得选」的前提是你足够努力</p>
        <div class="quick-chips">
          <button class="chip" onclick="quickAsk('我孩子560分河南的，想学金融，你怎么看？')">560分河南，想学金融</button>
          <button class="chip" onclick="quickAsk('双非考研到985值不值？')">双非考研到985值不值</button>
          <button class="chip" onclick="quickAsk('家里没钱，该不该为了理想学艺术？')">家里没钱该学艺术吗</button>
          <button class="chip" onclick="quickAsk('AI时代学什么专业还靠谱？')">AI时代什么专业靠谱</button>
          <button class="chip" onclick="quickAsk('生化环材真的是天坑吗？')">生化环材是天坑吗</button>
        </div>
      </div>
    </div>
  </div>

  <div class="analytics-wrap" id="analyticsView">
    <div class="ana-header">
      <h2 id="anaTitle">📊 对话数据分析</h2>
      <p id="anaSub">基于历史对话记录的统计分析</p>
    </div>
    <div class="stat-cards" id="statCards"></div>
    <div class="chart-grid">
      <div class="chart-card"><h3>话题分布</h3><canvas id="chartTopic"></canvas></div>
      <div class="chart-card"><h3>热门专业/领域</h3><canvas id="chartMajor"></canvas></div>
    </div>
    <div class="chart-grid">
      <div class="chart-card"><h3>对话趋势</h3><canvas id="chartTrend"></canvas></div>
      <div class="chart-card"><h3>用户活跃度</h3><canvas id="chartUsers"></canvas></div>
    </div>
    <div class="chart-card" id="adminUserTable" style="display:none;margin-top:14px;">
      <h3>👥 用户管理</h3>
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <input type="text" id="newUserName" placeholder="新用户名" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;">
        <input type="password" id="newUserPass" placeholder="密码" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;">
        <button class="btn btn-primary btn-sm" onclick="adminCreateUser()">＋ 创建用户</button>
      </div>
      <table class="user-table">
        <thead><tr><th>用户名</th><th>角色</th><th>对话数</th><th>提问数</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="input-area" id="inputArea">
    <div class="input-inner">
      <textarea id="userInput" placeholder="说说你的情况，我帮你捋捋..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
      <button id="sendBtn" onclick="sendMsg()" title="发送">↑</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>⚙ 设置</h3>
    <div id="adminSettingsSection">
    <label style="color:var(--accent);">🔗 服务器模式</label>
    <label>服务器地址 <span style="color:var(--text3);font-weight:400;">（部署 server.py 后填写）</span></label>
    <input type="text" id="serverUrl" placeholder="http://你的服务器IP:5000">
    <p style="font-size:11px;color:var(--text3);margin-top:4px;line-height:1.5;">填写后所有用户数据通过服务器中转，无需每人配 GitHub Token。</p>
    <hr style="border:none;border-top:1px solid var(--border);margin:12px 0;">
    <label style="color:var(--accent);">GitHub 数据源</label>
    <label>GitHub Token <span style="color:var(--text3);font-weight:400;">（<a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a> → 选 repo 权限）</span></label>
    <input type="password" id="githubToken" placeholder="ghp_...">
    <label>仓库 <span style="color:var(--text3);font-weight:400;">格式：owner/repo</span></label>
    <input type="text" id="githubRepo" placeholder="owner/repo" value="">
    <label>用户文件路径</label>
    <input type="text" id="githubPath" placeholder="users.json" value="users.json">
    <label>会话文件路径 <span style="color:var(--text3);font-weight:400;">（跨设备同步）</span></label>
    <input type="text" id="sessionsPath" placeholder="sessions.json" value="sessions.json">
    <button class="btn btn-sm btn-outline" onclick="initGithubData()" style="margin-top:8px;width:100%;">📤 推送初始数据到 GitHub（含跨设备配置）</button>
    <hr style="border:none;border-top:1px solid var(--border);margin:16px 0;">
    </div>
    <label>DeepSeek API Key <span style="color:var(--text3);font-weight:400;">（<a href="https://platform.deepseek.com" target="_blank">platform.deepseek.com</a> 免费申请，每人填自己的）</span></label>
    <input type="password" id="apiKey" placeholder="sk-...">
    <label>模型</label>
    <select id="modelSelect">
      <option value="deepseek-v4-flash">DeepSeek V4 Flash (推荐 · 快速便宜)</option>
      <option value="deepseek-v4-pro">DeepSeek V4 Pro (旗舰 · 深度推理 · 1M上下文)</option>
    </select>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveConfig()">保存</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
